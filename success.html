<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<title>Оформлення замовлення</title>

    <link rel="stylesheet" href="success.css">
</head>
<body>

    <!-- HEADER -->
    <header class="checkout-header">
        <a href="profile.html" id="accountLink" class="account-link">
    👤 Увійти
</a>

        <a href="cart.html" class="back-link">
            ← До кошика
        </a>

        <a href="index.html" class="site-logo">
            <img src="logo.png" alt="PrimeShop">
        </a>

        <button id="themeToggle" class="checkout-theme-btn">
            🌞
        </button>

    </header>

    <!-- MAIN -->
    <main class="checkout-page">


        <!-- LEFT -->
        <section class="checkout-left">
    <form id="checkoutForm" autocomplete="on">

            <h1>Оформлення замовлення</h1>

            <!-- CONTACTS -->
            <div class="checkout-block">

                <h2>Контактні дані</h2>

                <div class="form-grid">

                    <div class="input-group">
                        <label>Ім’я</label>
<input
    id="userName"
    name="name"
    autocomplete="name"
    type="text"
    placeholder="Ваше ім’я"
>

                    </div>

                    <div class="input-group">
                        <label>Телефон</label>
                        <input
    id="userPhone"
    name="tel"
    autocomplete="tel"
    type="tel"
    placeholder="+380"
    maxlength="10"
>
                    </div>

                    <div class="input-group full-width">
                        <label>Email</label>
                        <input
    id="userEmail"
    name="email"
    autocomplete="email"
    type="email"
    placeholder="example@gmail.com"
>
                    </div>

                </div>

            </div>

            <!-- DELIVERY -->
            <div class="checkout-block">

                <h2>Доставка</h2>

                <div class="form-grid">

                    <div class="input-group">
                        <label>Місто</label>
                        <input
    id="userCity"
    name="address-level2"
    autocomplete="address-level2"
    type="text"
    placeholder="Ваше місто"
    list="ukraineCities"
>

<datalist id="ukraineCities">
    <option value="Київ">
    <option value="Одеса">
    <option value="Харків">
    <option value="Львів">
    <option value="Дніпро">
    <option value="Запоріжжя">
    <option value="Вінниця">
    <option value="Полтава">
    <option value="Черкаси">
    <option value="Чернігів">
    <option value="Івано-Франківськ">
    <option value="Тернопіль">
    <option value="Рівне">
    <option value="Луцьк">
    <option value="Ужгород">
    <option value="Житомир">
    <option value="Миколаїв">
    <option value="Херсон">
    <option value="Чернівці">
    <option value="Суми">
</datalist>

                    </div>

                    <div class="input-group">
                        <label>Спосіб доставки</label>

                        <select>
                            <option>Нова Пошта</option>
                            <option>Укрпошта</option>
                            <option>Курʼєр</option>
                        </select>
                    </div>

                    <div class="input-group full-width">
                        <label>Адреса / Відділення</label>
                        <input
    id="userAddress"
    name="street-address"
    autocomplete="street-address"
    type="text"
    placeholder="Введіть адресу"
>
                    </div>

                </div>

            </div>

            <!-- PAYMENT -->
            <div class="checkout-block">

                <h2>Оплата</h2>

                <div class="payment-methods">

                    <label class="payment-card">
                        <input type="radio" name="payment" checked>
                        <span>💵 Оплата при отриманні</span>
                    </label>

                    <label class="payment-card">
                        <input type="radio" name="payment">
                        <span>💳 Оплата карткою</span>
                    </label>

                </div>

            </div>

            <!-- COMMENT -->
            <div class="checkout-block">

                <h2>Коментар</h2>

                <textarea
    id="userComment"
    name="comment"
    autocomplete="on"
    placeholder="Коментар до замовлення..."
></textarea>

            </div>

            </form>
</section>

        <!-- RIGHT -->
        <aside class="checkout-summary">

            <h2>Підсумок</h2>

            <div class="summary-products" id="summaryProducts">

            </div>

            <hr>

            <div class="summary-row">
                <span>Товари:</span>
                <b id="summaryCount">0</b>
            </div>

            <div class="summary-row">
                <span>Сума:</span>
                <b id="summaryPrice">0 грн</b>
            </div>

            <div class="summary-row discount">
                <span>Знижка:</span>
                <b id="summaryDiscount">0 грн</b>
            </div>

            <div class="summary-row">
                <span>Доставка:</span>
                <b>Безкоштовно</b>
            </div>

            <hr>

            <div class="summary-total">
                <span>Разом:</span>
                <b id="summaryTotal">0 грн</b>
            </div>

            <button id="confirmOrderBtn" class="confirm-btn" type="button">
                <span class="button__text">
                    Підтвердити замовлення
                </span>

                <span class="button__icon">✓</span>
            </button>

        </aside>

    </main>
<footer class="site-footer">
    <p>Контакти: info@mystore.ua | +380 00 000 00 00</p>
    <p>&copy; 2026 PrimeShop. Усі права захищені.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
